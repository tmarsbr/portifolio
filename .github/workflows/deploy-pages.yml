# Publica o portfólio estático no GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/public/imagem
          mkdir -p _site/public/images
          mkdir -p _site/public/projects
          cp index.html style.css main.js _site/
          cp -R posts _site/
          cp public/imagem/perfil-640.jpg _site/public/imagem/
          cp public/images/*.png _site/public/images/
          cp public/projects/*-1200.jpg _site/public/projects/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
